name: Release builds

# Runs when a release is published on GitHub and attaches the downloads to
# it. "Run workflow" (workflow_dispatch) builds the same files as workflow
# artifacts only, for testing without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            # Older Ubuntu for a lower glibc requirement, so the build runs on more distributions.
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxkbcommon-dev pkg-config

      - name: Test
        shell: bash
        run: cargo test --workspace --locked

      - name: Build
        shell: bash
        run: cargo build --release --locked -p fokus --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }}

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fokus-${{ matrix.target }}
          path: dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
