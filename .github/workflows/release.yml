name: Release builds

# Runs when a release is published on GitHub and attaches the downloads to
# it. "Run workflow" (workflow_dispatch) builds the same files as workflow
# artifacts only, for testing without a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MAC_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            # Older Ubuntu for a lower glibc requirement, so the build runs on more distributions.
            os: ubuntu-22.04
          - target: aarch64-apple-darwin
            os: macos-14
          # GitHub no longer offers Intel Mac runners; cross-build on Apple silicon.
          - target: x86_64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable && rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev libxkbcommon-dev pkg-config fonts-dejavu-core

      - name: Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: ls "/c/Program Files (x86)/Inno Setup "*/ISCC.exe 2>/dev/null || choco install innosetup -y --no-progress

      - name: Test
        shell: bash
        run: cargo test --workspace --locked

      - name: Build
        shell: bash
        run: cargo build --release --locked -p fokus --target ${{ matrix.target }}

      # Signing and notarising the Mac app. Skipped while the secrets are not
      # set; the app is then packaged unsigned. See packaging/macos/SIGNING.md.
      - name: Signing certificate
        if: runner.os == 'macOS' && env.MAC_SIGNING == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          # The intermediate that makes a Developer ID certificate valid; not every runner image has it.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security find-identity -p codesigning "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep -m1 -o '"Developer ID Application: [^"]*"' | tr -d '"' || true)"
          [ -n "$identity" ] || { echo "No valid Developer ID Application identity in MACOS_CERTIFICATE_P12 (see the list above)" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          if [ -n "$NOTARY_KEY_P8" ]; then
            printf '%s\n' "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
            echo "NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
          fi

      # UPDATE_SIGNING_KEY signs the downloads for the app's updater (packaging/UPDATES.md).
      # A release without it would never reach the installed apps, so it must be set then.
      - name: Package
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ "${{ github.event_name }}" = release ] && [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "UPDATE_SIGNING_KEY is not set; see packaging/UPDATES.md" >&2
            exit 1
          fi
          scripts/package.sh ${{ matrix.target }}

      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fokus-${{ matrix.target }}
          path: dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
